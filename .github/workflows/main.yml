name: Flask CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml

     
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aceest-fitness:${{ github.run_number }} .

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin


      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/aceest-fitness:${{ github.run_number }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/aceest-fitness:${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/aceest-fitness:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/aceest-fitness:latest