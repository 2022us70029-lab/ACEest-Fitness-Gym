# Canary Deployment Strategy
# Gradually roll out a new version to a small subset of users first
# Monitor metrics, then gradually increase traffic to the new version
# If issues arise, rollback without affecting all users

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
spec:
  replicas: 1  # Start with only 1 replica for canary
  selector:
    matchLabels:
      app: aceest-fitness
      version: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: canary
    spec:
      containers:
      - name: aceest-fitness
        image: 2022us70029/aceest-fitness-gym:latest
        ports:
        - containerPort: 5000
        env:
        - name: ENVIRONMENT
          value: "canary"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /version
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Stable/Production deployment - majority of traffic
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
spec:
  replicas: 2  # Keep stable version with more replicas
  selector:
    matchLabels:
      app: aceest-fitness
      version: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: stable
    spec:
      containers:
      - name: aceest-fitness
        image: your-dockerhub-username/aceest-fitness:v1.0  # Previous stable version
        ports:
        - containerPort: 5000
        env:
        - name: ENVIRONMENT
          value: "production"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10

---
# Service routes to both canary (10%) and stable (90%) based on label selector
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-service
spec:
  selector:
    app: aceest-fitness
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer